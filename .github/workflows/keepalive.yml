# Garde le projet Supabase actif (la version gratuite se met en pause après environ 7 jours sans activité).
# Utilise seulement la clé PUBLIQUE (déjà visible dans config.js) : aucune donnée n'est lue.
name: Garder Supabase actif
on:
  schedule:
    - cron: "17 14 * * 1,4"   # lundi et jeudi
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel léger à la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://juhnkuxxzomaramxmuik.supabase.co/rest/v1/rpc/at_my_role" -H "apikey: sb_publishable_ByhC9yVpU06Fvh4gKgAGvQ_yYqMrTdD" -H "Content-Type: application/json" -d '{}')
          echo "Réponse : $code"
          test "$code" -lt 500
