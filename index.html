:root{color-scheme:light dark;--brand:#d9f84a;--brandink:#111;--bg:light-dark(#f4f5f7,#0d1520);--card:light-dark(#fff,#16212f);--ink:light-dark(#10223a,#e8edf3);--mute:light-dark(#5b6b80,#93a3b8);--line:light-dark(#dde2e9,#263445);--red:#c8102e;--redsoft:light-dark(#fbe7ea,#3a1219);--ok:light-dark(#0f7a43,#4cc488);--oksoft:light-dark(#e3f4ea,#12321f);--warn:light-dark(#a35a00,#f0a650);--warnsoft:light-dark(#fff1dc,#3a2a10);--blue:light-dark(#1d5fd1,#7aa7ff);--bluesoft:light-dark(#e6eefc,#16264a)}

.qline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.qday h3::first-letter{text-transform:uppercase}.qline .qas{justify-content:flex-end}
@media(max-width:820px){.qline{grid-template-columns:1fr}.qline .qas{justify-content:flex-start}}
.hnext{margin:8px 0 2px}.hnext .hn-in{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;background:rgba(17,17,17,.08);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;color:#111;cursor:pointer}

.card.evtoday{border:2px solid #111;background:linear-gradient(0deg,#fff,#fff),#fff;box-shadow:0 0 0 4px #dcfa4b}.card.evtoday h3{display:flex;align-items:center;gap:8px;font-size:20px}
